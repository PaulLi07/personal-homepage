<dialog class="detail-overlay" id="detail-dialog" aria-labelledby="detail-title">
  <div class="panel-layout">
    <div class="panel-left">
      <button class="buttondiv closeBtn" id="close-detail" type="button"><span class="roll"><span>← Return to page</span><span aria-hidden="true">← Return to page</span></span></button>
      <p class="eyebrow panel-kicker" id="detail-kicker"></p>
      <h2 class="projecttitle" id="detail-title"></h2>
      <p class="projectshorttag" id="detail-subtitle"></p>
      <figure class="projectflip"><img id="detail-image" alt=""></figure>
      <a class="panel-image-credit" id="detail-credit" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <div class="right-part">
      <nav class="detail-tabs" id="detail-tabs" aria-label="Academic sections"></nav>
      <div id="detail-custom" hidden></div>
      <div class="description"><h3 id="detail-description-title">Overview</h3><div id="detail-description"></div></div>
      <dl class="detail-facts" id="detail-facts"></dl>
      <div class="detail-list"><h3 id="detail-list-title"></h3><div id="detail-entries"></div></div>
      <a class="buttondiv panel-link" id="detail-link" hidden target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
</dialog>
