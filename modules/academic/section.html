<section class="page2" id="academic" aria-labelledby="academic-title">
  <div class="section-background" aria-hidden="true"><img src="modules/academic/images/background.jpg" alt="" loading="lazy"></div>
  <div class="projectPreview">
    <div class="preview-stack">
      <img class="is-active" src="modules/academic/experience/images/cover.jpg" alt="The Cosmic Cliffs in the Carina Nebula" data-preview="experience" loading="lazy">
      <img src="modules/academic/publications/images/cover.jpg" alt="The Andromeda Galaxy in ultraviolet light" data-preview="publications" aria-hidden="true" loading="lazy">
      <img src="modules/academic/notes/images/cover.jpg" alt="The Pillars of Creation in the Eagle Nebula" data-preview="notes" aria-hidden="true" loading="lazy">
      <img src="modules/academic/projects/images/cover.jpg" alt="Earth rising above the lunar horizon" data-preview="projects" aria-hidden="true" loading="lazy">
    </div>
    <p class="preview-caption"><span id="preview-label" aria-live="polite">Experience</span><span>Choose a section below ↘</span></p>

    <div class="academic-header" data-reveal><p class="eyebrow">02 · Questions, ideas, and work</p><h2 class="section-heading" id="academic-title">Academic.</h2></div>
    <div class="mainprojectsdiv">
      <div class="academic-intro" data-reveal>
        <p>Academic experience, publications, study notes, and projects in theoretical physics.</p>
        <p>Hover to preview. Select a section to explore.</p>
      </div>
      <div class="projects" aria-label="Academic sections" data-reveal>
        <button class="projectBox is-selected" data-academic="experience" aria-label="Open Experience" aria-haspopup="dialog"><span class="thumbnail"><img src="modules/academic/experience/images/cover.jpg" alt="" loading="lazy"></span><span class="thumb-label">Experience ↗</span></button>
        <button class="projectBox" data-academic="publications" aria-label="Open Publications" aria-haspopup="dialog"><span class="thumbnail"><img src="modules/academic/publications/images/cover.jpg" alt="" loading="lazy"></span><span class="thumb-label">Publications ↗</span></button>

        <button class="projectBox" data-academic="projects" aria-label="Open Projects" aria-haspopup="dialog"><span class="thumbnail"><img src="modules/academic/projects/images/cover.jpg" alt="" loading="lazy"></span><span class="thumb-label">Projects ↗</span></button>
      </div>
    </div>
