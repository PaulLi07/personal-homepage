<section class="page2" id="academic" aria-labelledby="academic-title" data-particle-surface="black">
  <div class="academic-shell" data-particle-foreground>
    <div class="academic-divider" aria-hidden="true"><span></span></div>
    <header class="academic-header">
      <div><p class="eyebrow">02 / Questions, ideas &amp; work</p><h2 class="section-heading" id="academic-title">Academic.</h2></div>
      <p class="academic-intro">Exploring theoretical physics through research, reading and collaboration.</p>
    </header>
    <div class="academic-scene" data-academic-scene role="region" aria-label="Explore academic work">
      <nav class="academic-signpost" aria-label="Academic sections" data-particle-exclude>
        <p class="academic-signpost-kicker" data-particle-exclude>Explore academic work</p>
        <div class="academic-signboard" data-particle-exclude>
          <button class="projectBox" type="button" data-academic="experience" aria-label="Open Experience" aria-haspopup="dialog"><span class="academic-sign-index" aria-hidden="true">01</span><span class="thumb-label">Experience</span><span class="academic-sign-arrow" aria-hidden="true">↗</span></button>
          <button class="projectBox" type="button" data-academic="publications" aria-label="Open Publications" aria-haspopup="dialog"><span class="academic-sign-index" aria-hidden="true">02</span><span class="thumb-label">Publications</span><span class="academic-sign-arrow" aria-hidden="true">↗</span></button>
          <button class="projectBox" type="button" data-academic="notes" aria-label="Open Notes" aria-haspopup="dialog"><span class="academic-sign-index" aria-hidden="true">03</span><span class="thumb-label">Notes</span><span class="academic-sign-arrow" aria-hidden="true">↗</span></button>
          <button class="projectBox" type="button" data-academic="projects" aria-label="Open Projects" aria-haspopup="dialog"><span class="academic-sign-index" aria-hidden="true">04</span><span class="thumb-label">Projects</span><span class="academic-sign-arrow" aria-hidden="true">↗</span></button>
        </div>
        <div class="academic-signpost-pole" aria-hidden="true" data-particle-exclude></div>
      </nav>
      <div class="academic-image-window">
        <button class="academic-image-entry" type="button" data-scene-open aria-label="Open Experience" aria-haspopup="dialog">
          <span class="preview-stack" data-particle-exclude>
            <img class="is-active" data-preview="experience" src="modules/academic/experience/images/cover.jpg" alt="" aria-hidden="false" loading="lazy">
            <img data-preview="publications" src="modules/academic/publications/images/cover.jpg" alt="" aria-hidden="true" loading="lazy">
            <img data-preview="notes" src="modules/academic/notes/images/cover.jpg" alt="" aria-hidden="true" loading="lazy">
            <img data-preview="projects" src="modules/academic/projects/images/cover.jpg" alt="" aria-hidden="true" loading="lazy">
            <span class="academic-image-corner" aria-hidden="true">↗</span>
          </span>
          <span class="academic-window-caption"><span id="preview-label" data-scene-title>Experience</span><span class="academic-window-explore" data-scene-explore>Explore ↗</span></span>
          <span class="academic-window-description" data-scene-description>Research, learning, seminars and milestones.</span>
        </button>
        <div class="academic-gallery-controls">
          <span class="academic-gallery-index" data-scene-index aria-hidden="true">01 / 04</span>
          <span class="academic-gallery-steps" aria-hidden="true"><span data-scene-step="experience" class="is-active"></span><span data-scene-step="publications"></span><span data-scene-step="notes"></span><span data-scene-step="projects"></span></span>
        </div>
      </div>
      <div class="academic-tree" aria-hidden="true" data-particle-exclude><img src="modules/academic/exploration/tree.svg" alt="" width="360" height="620" loading="lazy"></div>
      <div class="academic-walkway" data-scene-walkway aria-hidden="true" data-particle-exclude><div class="academic-walker" data-scene-walker><img class="academic-walker-fallback" data-walker-fallback src="modules/academic/exploration/walker.svg" alt=""></div></div>
      <div class="academic-ground" aria-hidden="true" data-particle-exclude><img src="modules/academic/exploration/grass.svg" alt="" loading="lazy"></div>
    </div>
    <a class="academic-publication" id="academic-featured-publication" href="#academic/publications" data-particle-exclude hidden>
      <span class="academic-publication-kicker">Selected publication</span>
      <span class="academic-publication-copy"><span id="academic-publication-title"></span><span id="academic-publication-meta"></span></span>
      <span class="academic-publication-arrow" aria-hidden="true">↗</span>
    </a>
  </div>
</section>
