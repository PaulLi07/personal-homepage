<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3f2"><title>Physics Pioneers Archive</title>
  <meta name="description" content="Explore physicists, their contributions and milestone records through an interactive historical timeline.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <script defer src="data/archive.js"></script><script defer src="core.js"></script>
  <script defer src="timeline.js"></script><script defer src="scroll-sync.js"></script><script defer src="breakthrough.js"></script>
  <script defer src="density-palette.js"></script>
  <script defer src="plot-display.js"></script>
  <script defer src="data/breakthrough-data.js"></script><script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#people-list" data-label="skip">Skip to people</a>
<div class="workspace" data-scroll-driver="list">
  <aside class="sidebar">
    <a class="wordmark" href="#" id="reset-all"><span class="mark" aria-hidden="true">φ</span><strong data-label="brand">Physics Pioneers</strong></a>
    <div class="axis-header"><button id="index-method" class="index-title" data-label="indexTitle">Breakthrough index</button><span class="info-dot" aria-hidden="true">i</span></div>
    <button class="axis-year" id="year-detail" title="Year in physics"><span id="axis-year">—</span><span aria-hidden="true">↗</span></button>
    <div class="axis-wrap" id="axis-wrap" role="slider" tabindex="0" aria-orientation="vertical" aria-label="Drag the timeline to navigate contribution years"><svg id="time-axis" aria-hidden="true"></svg><div id="axis-tooltip" class="axis-tooltip" hidden></div></div>
    <div class="color-key"><div class="color-key-title"><span data-label="density">Contributor density</span><span id="density-unit"></span></div><svg id="density-scale" role="img" aria-label="Contributor density scale"></svg></div>
    <div class="reading"><span data-label="reading">Contribution years</span><strong id="reading-range">—</strong></div>
    <p class="axis-foot" data-label="axisFoot">Contribution years · Adaptive timeline</p>
  </aside>
  <main class="main-pane">
    <header class="page-header"><div><p class="eyebrow" data-label="eyebrow">PHYSICS · HISTORY · PEOPLE</p><h1 data-label="title">Physics Pioneers Archive</h1><p id="archive-subtitle"></p></div><a class="archive-return" href="../../../../../../../index.html#academic/projects/physicists" title="Back to the Physicists project"><span aria-hidden="true">←</span> Physicists</a></header>
    <div class="filter-bar"><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="query" data-label="search">Search names or research fields</label><input id="query" type="search" autocomplete="off" spellcheck="false"><button id="clear-query" hidden>×</button><kbd>/</kbd></div><label class="field-select"><span class="sr-only" data-label="field">Research fields</span><select id="field"></select></label></div>
    <div class="archive-body">
      <div class="list-pane"><div class="list-summary"><span id="result-status" role="status" aria-live="polite"></span></div><div class="column-labels" aria-hidden="true"><span data-label="contributionYear">Year</span><span data-label="person">Person</span><span data-label="field">Research fields</span><span></span></div><section id="list-scroll" class="list-scroll"><div id="people-list"></div><div id="empty" class="empty" hidden><h2 data-label="noResults">No matching people</h2><p data-label="noResultsHint">Try another name or research field.</p></div></section></div>
      <aside class="preview-rail"><div class="year-card" id="year-card"></div></aside>
    </div>
    <footer class="pane-footer"><span id="coverage-status"></span><span id="archive-date"></span></footer>
  </main>
</div>
<dialog class="dossier" id="dossier" aria-labelledby="dossier-name"><div class="sheet-toolbar"><span data-label="dossier">Dossier</span><div><button id="close-dossier" class="close" aria-label="Close">×</button></div></div><div id="sheet-content" class="sheet-scroll"></div></dialog>
<dialog class="insight" id="insight" aria-labelledby="insight-title"><div class="sheet-toolbar"><span id="insight-toolbar"></span><button id="close-insight" class="close" aria-label="Close">×</button></div><div id="insight-content" class="sheet-scroll"></div></dialog>
<noscript>Please enable JavaScript to view the archive.</noscript>
</body></html>
